<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | EcoCampus</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <!-- Navigation -->
    <header>
        <nav>
            <h2>🌿 EcoCampus</h2>

            <div>
                <a href="index.html">Home</a>
                <a href="login.html">Student Login</a>
                <a href="register.html">Register</a>
            </div>
        </nav>
    </header>

    <!-- Student Login Form -->
    <section class="report-page">

        <h1>🎓 Student Login</h1>

        <p>Welcome back to EcoCampus!</p>
        <p>Login to access your student dashboard.</p>

        <form id="loginForm">

            <label for="studentEmail">Student Email</label>
            <input
                type="email"
                id="studentEmail"
                placeholder="Enter your email"
                required
            >

            <label for="studentPassword">Password</label>
            <input
                type="password"
                id="studentPassword"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p id="loginMessage" role="status"></p>

        <p>
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

        <a href="index.html">← Back to Home</a>

    </section>

    <!-- Login JavaScript -->
    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email = document
                    .getElementById("studentEmail")
                    .value.trim().toLowerCase();

                const password = document
                    .getElementById("studentPassword")
                    .value;

                const message =
                    document.getElementById("loginMessage");

                // Demo login only
                if (
                    email === "demo002@ecocampus.com" &&
                    password === "Eco@1002"
                ) {
                    localStorage.setItem(
                        "ecoCampusCurrentStudent",
                        email
                    );

                    message.textContent = "Login successful! 🌿";
                    message.style.color = "green";

                    window.location.href = "dashboard.html";

                } else {
                    message.textContent =
                        "Invalid email or password. Please try again.";

                    message.style.color = "red";
                }
            });
    </script>
    
</body>
</html>
